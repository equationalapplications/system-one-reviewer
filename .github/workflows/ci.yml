name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps (pytest only — no network in tests)
        run: python -m pip install pytest
      - name: Run test suite (offline)
        run: python -m pytest tests/ -q
        env:
          # no secrets, no network: the suite stubs providers and points
          # HOME/JEV_REVIEW_METRICS at tmp dirs itself
          TYPESAFE_API_KEY: ""
