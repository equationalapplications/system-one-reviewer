# Tool config only — the reviewer is a single dependency-free script, not
# an installable package. Dev/CI tools are pinned in requirements-dev.txt.

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["tests/data"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade. Formatting is
# not enforced (a `ruff format` pass would rewrite ~2k lines of history).
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["system_one_reviewer.py", "scripts/sweep-thresholds.py", "scripts/build_release.py"]
# The code is mostly unannotated; without this mypy skips those bodies and
# checks almost nothing.
check_untyped_defs = true
warn_unused_ignores = true
